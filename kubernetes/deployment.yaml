
apiVersion: apps/v1
kind: Deployment
metadata:
  name: formlabs-helloapp
  labels:
    app: formlabs-helloapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: formlabs-helloapp
  template:
    metadata:
      labels:
        app: formlabs-helloapp
    spec:
      containers:
        - name: helloapp
          image: formlabs-helloapp:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
