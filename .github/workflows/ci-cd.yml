
name: Formlabs DevOps CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s helloapp -p 'test*.py'

      - name: Build Docker image
        run: docker build -t formlabs-helloapp:local .

      - name: Create Kubernetes cluster
        uses: helm/kind-action@v1.12.0

      - name: Load Docker image into kind
        run: kind load docker-image formlabs-helloapp:local

      - name: Deploy application
        run: |
          kubectl apply -f kubernetes/
          kubectl rollout status deployment/formlabs-helloapp --timeout=120s

      - name: Verify application
        run: |
          kubectl get pods -l app=formlabs-helloapp
          kubectl port-forward service/formlabs-helloapp 8081:80 > /tmp/port-forward.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8081 | grep -q "Hello, World!"; then
              echo "Application HTTP check passed"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/port-forward.log
          exit 1
